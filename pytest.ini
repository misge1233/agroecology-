[pytest]
# Repo-root pytest config (Phase P6b-i). `pythonpath = .` makes `rag`,
# `model` and `pipelines` importable as packages from the repo root, which is
# what lets rag/graph and rag/ingest/wocat use package-relative imports
# (`from . import schema`) instead of the sys.path hacks they used to need.
#
# Run from the repo root:
#     python -m pytest rag/graph rag/ingest/wocat -q
#     python -m pytest model pipelines -q
# The backend keeps its own app/backend/pytest.ini and is run from there.
pythonpath = .
norecursedirs = .git .venv venv node_modules app/backend/.venv app/frontend rag/index rag/corpus geodata
